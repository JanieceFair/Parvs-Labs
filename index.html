<section class="review-container">
  <h3>Leave a Review!</h3>

  <form class="review-form">

      <option value="">Select rating...</option>
      <option value="5">★★★★★ — Excellent</option>
      <option value="4">★★★★☆ — Great</option>
      <option value="3">★★★☆☆ — Good</option>
      <option value="2">★★☆☆☆ — Fair</option>
      <option value="1">★☆☆☆☆ — Poor</option>
    </select>

    <label for="review-text">Your Review</label>
    <textarea id="review-text" name="review-text" rows="5" placeholder="Share your experience..." required></textarea>

    <button type="submit" class="btn-active">Submit Review</button>

<script>
let slideIndexA = 0;
showSlidesA();

function showSlidesA() {
    let slidesA = document.getElementsByClassName("mySlides");
    
    for (let i = 0; i < slidesA.length; i++) {
        slidesA[i].style.display = "none";
    }

    slideIndexA++;
    if (slideIndexA > slidesA.length) {
        slideIndexA = 1;
    }

    slidesA[slideIndexA - 1].style.display = "block";
    setTimeout(showSlidesA, 3000);
}

let slideIndexB = 0;
showSlidesB();

function showSlidesB() {
    let slidesB = document.getElementsByClassName("mySlides-b");
    
    for (let i = 0; i < slidesB.length; i++) {
        slidesB[i].style.display = "none";
    }

    slideIndexB++;
    if (slideIndexB > slidesB.length) {
        slideIndexB = 1;
    }

    slidesB[slideIndexB - 1].style.display = "block";
    setTimeout(showSlidesB, 3000);
}
</script>
